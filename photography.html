<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Photography - Rehana Tuljannah</title>
<!-- Tailwind CSS -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f2e205;
        }
        .font-display {
            font-family: 'Fredoka', cursive, sans-serif;
        }
        .marquee-container {
            display: flex;
            overflow: hidden;
            user-select: none;
        }
        .marquee-content {
            flex-shrink: 0;
            display: flex;
            justify-content: space-around;
            min-width: 100%;
            animation: scroll 18s linear infinite;
        }
        @keyframes scroll {
            from { transform: translateX(0); }
            to { transform: translateX(-100%); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-amber-300 text-slate-800 p-3 md:p-6 select-none">
<!-- NAVIGATION -->
<header class="max-w-5xl mx-auto w-full mb-4 flex justify-center gap-2 flex-wrap">
<a class="px-4 py-2 rounded-full font-bold text-xs md:text-sm bg-white text-slate-800 shadow-md hover:scale-105 transition" href="code.html">← Kembali</a>
</header>
<!-- PHOTOGRAPHY SLIDE -->
<section class="max-w-5xl mx-auto w-full bg-stone-50 rounded-3xl p-6 md:p-10 relative shadow-2xl border-4 border-white my-auto">
<!-- Header -->
<div class="text-center mb-8">
<span class="inline-block bg-blue-800 text-amber-300 font-display font-bold text-sm px-4 py-1 rounded-full uppercase tracking-wider mb-1">
                my
            </span>
<h1 class="font-display text-4xl md:text-6xl font-black text-blue-600 tracking-wide drop-shadow-[0_3px_0_rgba(253,224,71,1)]">
                PHOTOGRAPHY
            </h1>
</div>
<!-- Photo Grid Showcase -->
<div class="flex flex-wrap justify-center gap-4" id="photo-grid">
<div class="w-[70%] sm:w-[45%] md:w-[30%] bg-slate-900 p-2 rounded-xl shadow-lg border-2 border-slate-700 transform hover:scale-105 transition cursor-pointer">
<img alt="Makro" class="w-full aspect-square object-cover object-center rounded-lg" src="foto/Makro%20(1).jpg"/>
</div>
<div class="w-[70%] sm:w-[45%] md:w-[30%] bg-slate-900 p-2 rounded-xl shadow-lg border-2 border-slate-700 transform hover:scale-105 transition cursor-pointer">
<img alt="Sky" class="w-full aspect-square object-cover object-center rounded-lg" src="foto/Sky.jpg"/>
</div>
<div class="w-[70%] sm:w-[45%] md:w-[30%] bg-slate-900 p-2 rounded-xl shadow-lg border-2 border-slate-700 transform hover:scale-105 transition cursor-pointer">
<img alt="Bendera" class="w-full aspect-square object-cover object-center rounded-lg" src="foto/bendera.jpg"/>
</div>
</div>
</section>
<!-- LIGHTBOX POPUP -->
<div class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 p-4" id="lightbox" onclick="closeLightbox()">
<button class="absolute top-4 right-4 bg-white text-slate-800 font-bold w-10 h-10 rounded-full shadow-lg hover:scale-110 transition" type="button">✕</button>
<img alt="Photo Preview" class="max-h-[90vh] max-w-[90vw] rounded-2xl border-4 border-white shadow-2xl" id="lightbox-img" src=""/>
</div>
<!-- FOOTER MARQUEE RUNNING TEXT -->
<footer class="w-full bg-blue-800 text-amber-300 font-display font-bold text-xs md:text-sm py-2 mt-6 rounded-xl overflow-hidden shadow-inner border border-blue-700">
<div class="marquee-container">
<div class="marquee-content uppercase tracking-widest gap-8">
<span>every photo tells a story</span> •
                <span>every photo tells a story</span> •
                <span>every photo tells a story</span> •
                <span>every photo tells a story</span> •
            </div>
<div aria-hidden="true" class="marquee-content uppercase tracking-widest gap-8">
<span>every photo tells a story</span> •
                <span>every photo tells a story</span> •
                <span>every photo tells a story</span> •
                <span>every photo tells a story</span> •
            </div>
</div>
</footer>
<script>
        // LIGHTBOX
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(src) {
            lightboxImg.src = src;
            lightbox.classList.remove('hidden');
            lightbox.classList.add('flex');
        }

        function closeLightbox() {
            lightbox.classList.add('hidden');
            lightbox.classList.remove('flex');
            lightboxImg.src = '';
        }

        document.querySelectorAll('#photo-grid img').forEach(img => {
            img.parentElement.addEventListener('click', () => openLightbox(img.src));
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>
</body>
</html>
